<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Power of Sequencing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Sequencing</h1>
    <p>Couple of images can tell a different story but depending on the sequence</p>
    <h2 id="sequenceTitle">First Sequence</h2>

    <div class="sequence">
        <img id="firstBox" src="images/cloudy.jpeg" alt="Cloudy sky">
        <img id="scndBox" src="images/rain.jpeg" alt="Person in the rain with umbrella">
        <img id="thrdBox" src="images/sunny.jpeg" alt="Sunny sky">
    </div>

    <button id="changeBut">Change Sequence</button>
    <script src="script.js"></script>

</body>
</html>
